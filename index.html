<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agent Arena</title>
    <style>
      html, body { margin: 0; min-height: 100%; background: #0d0f14; color: #e8e8ea; font-family: ui-monospace, monospace; }
      body { display: grid; place-items: center; }
      body { gap: 12px; align-content: center; }
      canvas { image-rendering: pixelated; width: min(960px, 100vw); height: auto; cursor: pointer; }
      button { font: inherit; color: inherit; background: #1b1f2a; border: 1px solid #3a4152; padding: 8px 16px; cursor: pointer; }
      button:hover { background: #262c3b; }
    </style>
  </head>
  <body>
    <canvas id="game" width="480" height="270"></canvas>
    <button id="music" type="button" aria-pressed="false">Play music</button>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
