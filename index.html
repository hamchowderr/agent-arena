<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <title>Agent Arena</title>
    <meta name="description" content="A free, open-source pixel survivors-like that plays in your browser. Grow your own agent and fight the rivals who want you to rent theirs." />
    <meta name="theme-color" content="#0d0f14" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="canonical" href="%SITE_URL%" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Agent Arena" />
    <meta property="og:title" content="Agent Arena" />
    <meta property="og:description" content="A free, open-source pixel survivors-like that plays in your browser. Grow your own agent and fight the rivals who want you to rent theirs." />
    <meta property="og:url" content="%SITE_URL%" />
    <meta property="og:image" content="%SITE_URL%og.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:video" content="%SITE_URL%og-video.mp4" />
    <meta property="og:video:secure_url" content="%SITE_URL%og-video.mp4" />
    <meta property="og:video:type" content="video/mp4" />
    <meta property="og:video:width" content="1200" />
    <meta property="og:video:height" content="630" />
    <meta name="twitter:card" content="player" />
    <meta name="twitter:title" content="Agent Arena" />
    <meta name="twitter:description" content="A free, open-source pixel survivors-like that plays in your browser. Grow your own agent and fight the rivals who want you to rent theirs." />
    <meta name="twitter:image" content="%SITE_URL%card.jpg" />
    <meta name="twitter:player" content="%SITE_URL%" />
    <meta name="twitter:player:width" content="480" />
    <meta name="twitter:player:height" content="480" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Silkscreen&display=swap" rel="stylesheet" />
    <style>
      html, body { margin: 0; width: 100%; height: 100%; background: #0d0f14; color: #e8e8ea; font-family: "Silkscreen", ui-monospace, monospace; overflow: hidden; overscroll-behavior: none; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; }
      #stage { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; height: 100dvh; }
      #frame { position: absolute; inset: 0; }
      #safe { position: fixed; inset: 0; visibility: hidden; pointer-events: none; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
      #frame canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; -webkit-user-select: none; user-select: none; }
      #world { image-rendering: pixelated; }
      #status { position: absolute; inset: 0; display: grid; place-items: center; font-size: 24px; }
    </style>
  </head>
  <body>
    <div id="safe"></div>
    <div id="stage">
      <div id="frame">
        <canvas id="world" width="480" height="270"></canvas>
        <canvas id="hud" width="1440" height="810"></canvas>
        <div id="status">Loading Agent Arena...</div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
